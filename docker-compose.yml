services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: talent
      POSTGRES_PASSWORD: talent
      POSTGRES_DB: talent_network
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talent -d talent_network']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs-permissions:
    image: alpine:3.23.0
    user: root
    volumes:
      - rustfs_data:/data
    command: ['sh', '-c', 'chown -R 10001:10001 /data']
    restart: 'no'

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-talent-local-access}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-talent-local-secret-change-me}
      RUSTFS_HEALTH_ENDPOINT_ENABLE: 'true'
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9000/health/ready >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMD_STARTUP_TIMEOUT: 180
    ports:
      - '3310:3310'
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping=5 >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  clamav_signatures:
